[worldserver]

########################################
# Corpse Respawn module configuration
########################################
#
#    CorpseRespawn.Enable
#        Description: Spawn the player's ghost at their corpse after releasing spirit.
#        Default:     0 - Disabled
#                     1 - Enabled
#

CorpseRespawn.Enable = 1

#
#    CorpseRespawn.SendGraveyardMarker
#        Description: Show the spirit-healer (graveyard) marker on the minimap even though
#                     the ghost is spawned at the corpse.
#        Default:     0 - Disabled
#                     1 - Enabled
#

CorpseRespawn.SendGraveyardMarker = 1
