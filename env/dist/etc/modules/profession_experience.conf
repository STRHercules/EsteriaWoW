[worldserver]

########################################
# Profession Experience Configuration
########################################
#
#    ProfessionExperience.Enable
#        Description: Master switch to enable or disable the profession experience module.
#        Default:     1 - (Enabled)
#                     0 - (Disabled)

ProfessionExperience.Enable = 1

#
#    ProfessionExperience.MaxLevel
#        Description: Maximum player level up to which profession experience is granted.
#                     Set to 80 for full WotLK leveling progression.
#        Default:     80
#

ProfessionExperience.MaxLevel = 80

#
#    ProfessionExperience.XPRate
#        Description: Global multiplier applied to all experience awarded by this module.
#        Default:     1.0
#

ProfessionExperience.XPRate = 1.0

#
#    ProfessionExperience.UseServerRate
#        Description: If enabled, multiplies module XP by the server's Rate.XP.Kill / Rate.XP.Quest rate.
#        Default:     1 - (Enabled)
#                     0 - (Disabled, uses static module rates only)

ProfessionExperience.UseServerRate = 1

#
#    ProfessionExperience.AllowRestedBonus
#        Description: If enabled, rested experience bonus applies to profession experience when rested.
#        Default:     1 - (Enabled)
#                     0 - (Disabled)

ProfessionExperience.AllowRestedBonus = 1

#
#    ProfessionExperience.EnableLevelDeltaPenalty
#        Description: Prevents high-level characters from gaining significant XP by spamming low-level / starter nodes.
#                     Reduces XP smoothly when character level is significantly higher than the expected level of the node/recipe.
#        Default:     1 - (Enabled)
#                     0 - (Disabled)

ProfessionExperience.EnableLevelDeltaPenalty = 1

#
#    ProfessionExperience.AnnounceXP
#        Description: Announces the gained XP in chat as a system message.
#        Default:     0 - (Disabled/Quiet)
#                     1 - (Enabled)

ProfessionExperience.AnnounceXP = 0

########################################
# Difficulty (Recipe Color) Multipliers
########################################
#
#    Multipliers based on recipe difficulty relative to character skill level:
#    - Orange: 100% skillup chance (current progression)
#    - Yellow: moderate skillup chance
#    - Green:  low skillup chance
#    - Gray:   trivial (no skillup)
#

ProfessionExperience.Mult.Orange = 1.25
ProfessionExperience.Mult.Yellow = 1.00
ProfessionExperience.Mult.Green  = 0.50
ProfessionExperience.Mult.Gray   = 0.00

########################################
# Tier (Skill Rank) Multipliers
########################################
#
#    Multipliers for skill tiers (Apprentice through Grand Master):
#    - Apprentice:  1 - 75
#    - Journeyman:  76 - 150
#    - Expert:      151 - 225
#    - Artisan:     226 - 300
#    - Master:      301 - 375
#    - Grand Master: 376 - 450
#

ProfessionExperience.Mult.Apprentice  = 1.0
ProfessionExperience.Mult.Journeyman  = 1.0
ProfessionExperience.Mult.Expert      = 1.0
ProfessionExperience.Mult.Artisan     = 1.0
ProfessionExperience.Mult.Master      = 1.0
ProfessionExperience.Mult.GrandMaster = 1.0

########################################
# Gathering Professions
########################################
#
#    Fraction of the current level's total XP awarded per gather action (e.g. 0.015 = 1.5% of level XP).
#

ProfessionExperience.Herbalism.Enable   = 1
ProfessionExperience.Herbalism.Rate     = 0.015

ProfessionExperience.Mining.Enable      = 1
ProfessionExperience.Mining.Rate        = 0.015

ProfessionExperience.Skinning.Enable    = 1
