########################################
# mod-azeroth-plex configuration
########################################
#
# Server half of the AzerothPlex client extension.
#
# AzerothPlex plays a Plex stream inside the WoW client and can place the video on a world-space
# screen. This module is the in-server half of "nearby broadcast": a player publishes the pose of
# their screen and the encoded video/audio, and every other AzerothPlex client standing near that
# pose on the same map receives it and renders the screen where the broadcaster put it.
#
# The media never touches the game socket. The module listens on its own TCP port (AzerothPlex.Port)
# next to the worldserver; the AzerothPlex helper in the client opens a second connection to it and
# identifies itself with the character GUID it reports. Because the server already knows every
# player's map and position, the module decides who is close enough to hear a broadcast -- the
# client sends no position of its own and needs no addon or opcode.
#

#
#    AzerothPlex.Enable
#        Description: Start the AzerothPlex media listener with the worldserver.
#        Default:     1 - (Enabled)
#                     0 - (Disabled)
#

AzerothPlex.Enable = 1

#
#    AzerothPlex.Port
#        Description: TCP port the media listener binds. Publish it the same way the world port is
#                     published, or nearby players outside the host cannot connect.
#        Default:     8086
#

AzerothPlex.Port = 8086

#
#    AzerothPlex.BindAddress
#        Description: Interface the media listener binds. 0.0.0.0 accepts every interface.
#        Default:     0.0.0.0
#

AzerothPlex.BindAddress = 0.0.0.0

#
#    AzerothPlex.RequireMatchingAddress
#        Description: Refuse a media connection unless it comes from the same address as that
#                     character's game session. Keep this on unless you are testing: without it the
#                     only identity a media connection carries is the GUID it claims.
#        Default:     1 - (Required)
#                     0 - (Any address may claim any online character)
#

AzerothPlex.RequireMatchingAddress = 1

#
#    AzerothPlex.RangeYards
#        Description: How far from the broadcaster's screen a player can stand and still receive it.
#        Default:     80.0
#

AzerothPlex.RangeYards = 80.0

#
#    AzerothPlex.MaxBroadcastersPerMap
#        Description: Simultaneous broadcasts allowed on one map before new ones are refused.
#        Default:     8
#

AzerothPlex.MaxBroadcastersPerMap = 8

#
#    AzerothPlex.MaxViewersPerBroadcast
#        Description: Viewers one broadcaster may have at once.
#        Default:     16
#

AzerothPlex.MaxViewersPerBroadcast = 16

#
#    AzerothPlex.VideoBitrate
#        Description: Encoder bitrate, in bits per second, the module asks clients to use. This is
#                     the quality/bandwidth knob: lower it if the server uplink saturates.
#        Default:     800000
#

AzerothPlex.VideoBitrate = 800000

#
#    AzerothPlex.VideoFps
#        Description: Frames per second the module asks clients to encode.
#        Default:     24
#

AzerothPlex.VideoFps = 24

#
#    AzerothPlex.VideoWidth / AzerothPlex.VideoHeight
#        Description: Frame size the module asks clients to encode and decode. The client's screen
#                     texture is fixed at 640x360 today; anything other than that is refused by the
#                     client, so these are the only values that currently make sense.
#        Default:     640 / 360
#

AzerothPlex.VideoWidth = 640
AzerothPlex.VideoHeight = 360

#
#    AzerothPlex.RequireClientVersion
#        Description: Minimum AzerothPlex protocol version a client must report in its handshake.
#                     Raise it to refuse older helpers after a protocol change.
#        Default:     1
#

AzerothPlex.RequireClientVersion = 1

#
#    AzerothPlex.LogLevel
#        Description: 0 - quiet, 1 - handshakes and broadcast start/stop, 2 - per-tick membership.
#        Default:     1
#

AzerothPlex.LogLevel = 1
