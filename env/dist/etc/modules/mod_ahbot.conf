[worldserver]

# ============================================================
# AUCTION HOUSE BOT - SMALL PRIVATE REALM
# ============================================================

AuctionHouseBot.DEBUG = 0
AuctionHouseBot.DEBUG_CONFIG = 0
AuctionHouseBot.DEBUG_FILTERS = 0
AuctionHouseBot.DEBUG_BUYER = 0
AuctionHouseBot.DEBUG_SELLER = 0
AuctionHouseBot.TRACE_SELLER = 0
AuctionHouseBot.TRACE_BUYER = 0

# Actually enable the AH bot
AuctionHouseBot.EnableSeller = 1
AuctionHouseBot.Buyer.Enabled = true
AuctionHouseBot.EnableBuyer = 1

# Set these to your AH bot account/character
AuctionHouseBot.Account = 1
AuctionHouseBot.GUID = 1004

# Leave undocumented multi-GUID setting alone unless needed
AuctionHouseBot.GUIDs = 1004

# Pricing
AuctionHouseBot.UseBuyPriceForSeller = 1
AuctionHouseBot.UseBuyPriceForBuyer = 1

# I would leave dynamic market pricing OFF initially
AuctionHouseBot.UseMarketPriceForSeller = 0
AuctionHouseBot.MarketResetThreshold = 15

# Populate/update reasonably quickly
AuctionHouseBot.ItemsPerCycle = 300

# Keep the bot's background stock independent of player auctions
AuctionHouseBot.ConsiderOnlyBotAuctions = 1

# Don't flood the AH with 20 copies of everything
AuctionHouseBot.DuplicatesCount = 4

# Cleaner stack sizes: 5 / 10 / 15 / 20 instead of weird random amounts
AuctionHouseBot.DivisibleStacks = 1

# 1-24 hour auctions
AuctionHouseBot.ElapsingTimeClass = 1


# ============================================================
# ITEM SOURCES
# ============================================================

# Don't bother reselling ordinary vendor junk
AuctionHouseBot.VendorItems = 0
AuctionHouseBot.VendorTradeGoods = 0

# Important: populate the AH with things people actually farm
AuctionHouseBot.LootItems = 1
AuctionHouseBot.LootTradeGoods = 1

# Miscellaneous items can create a ton of junk
AuctionHouseBot.OtherItems = 0

# Allow miscellaneous trade materials
AuctionHouseBot.OtherTradeGoods = 1

# Definitely useful on a small realm
AuctionHouseBot.ProfessionItems = 1


# ============================================================
# BINDING
# ============================================================

AuctionHouseBot.No_Bind = 1
AuctionHouseBot.Bind_When_Picked_Up = 0
AuctionHouseBot.Bind_When_Equipped = 1
AuctionHouseBot.Bind_When_Use = 1
AuctionHouseBot.Bind_Quest_Item = 0


# ============================================================
# FILTER OUT WEIRD / INVALID AH ITEMS
# ============================================================

AuctionHouseBot.DisablePermEnchant = 0
AuctionHouseBot.DisableConjured = 1
AuctionHouseBot.DisableGems = 0

AuctionHouseBot.DisableMoney = 1
AuctionHouseBot.DisableMoneyLoot = 1
AuctionHouseBot.DisableLootable = 1
AuctionHouseBot.DisableKeys = 1
AuctionHouseBot.DisableDuration = 1

AuctionHouseBot.DisableBOP_Or_Quest_NoReqLevel = 1


# ============================================================
# CLASS ITEMS
# ============================================================

